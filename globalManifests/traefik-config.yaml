apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ingressRoute:
      dashboard:
        enabled: true
    additionalArguments:
    - "--api.insecure=true"
    ports:
      traefik:
        expose:
          default: true

